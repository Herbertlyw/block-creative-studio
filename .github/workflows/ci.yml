name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install FFmpeg and verify tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run check:repository
      - run: npm run test:repository
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm run build:cli
      - name: Check CLI discovery
        run: |
          node dist-cli/bcs.js games list --json > /tmp/bcs-games.json
          node -e "const r = require('/tmp/bcs-games.json'); if (!r.ok || r.report.games.length !== 2) process.exit(1)"
